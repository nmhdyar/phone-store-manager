{% extends "base.html" %}
{% block title %}Restock · Phone Store Manager{% endblock %}
{% block content %}
<header class="topbar"><div><p class="eyebrow">INVENTORY</p><h1>Restock Product</h1><p class="subtitle">{{ phone.name }} · Current stock: {{ phone.quantity }}</p></div><a class="text-link" href="{{ url_for('dashboard') }}">← Dashboard</a></header>
<section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label for="quantity">Units to add</label><input id="quantity" name="quantity" type="number" min="1" step="1" value="1" required></div>
<div class="form-actions"><a class="btn-secondary" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn-primary" type="submit">Update Stock</button></div></form></section>
{% endblock %}
