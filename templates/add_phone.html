{% extends "base.html" %}
{% block title %}Add Product · Phone Store Manager{% endblock %}
{% block content %}
<header class="topbar"><div><p class="eyebrow">INVENTORY</p><h1>Add New Product</h1><p class="subtitle">Create a product in your store inventory.</p></div><a class="text-link" href="{{ url_for('dashboard') }}">← Dashboard</a></header>
<section class="panel form-panel"><form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label for="name">Product name</label><input id="name" name="name" maxlength="120" value="{{ request.form.get('name','') }}" required></div>
  <div class="form-row">
    <div class="form-group"><label for="price">Selling price (Toman)</label><input type="number" id="price" name="price" min="0.01" step="any" value="{{ request.form.get('price','') }}" required></div>
    <div class="form-group"><label for="cost_price">Purchase cost (Toman · optional)</label><input type="number" id="cost_price" name="cost_price" min="0" step="any" value="{{ request.form.get('cost_price','') }}" placeholder="Leave blank if unknown"></div>
  </div>
  <div class="form-group"><label for="quantity">Initial quantity</label><input type="number" id="quantity" name="quantity" min="0" step="1" value="{{ request.form.get('quantity','0') }}" required></div>
  <div class="form-actions"><a class="btn-secondary" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn-primary" type="submit">Save Product</button></div>
</form></section>
{% endblock %}
